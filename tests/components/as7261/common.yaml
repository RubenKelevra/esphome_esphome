as7261:
  id: as7261_sensor
  int_pin:
    number: GPIO4
    inverted: true
    mode:
      input: true
      pullup: true
  reset_pin:
    number: GPIO5
    inverted: true
  oklab_reference_illuminance: 750 lx
  update_interval: 30s

button:
  - platform: as7261
    id: as7261_sensor
    measure:
      name: AS7261 Measure

sensor:
  - platform: as7261
    as7261_id: as7261_sensor
    cct:
      name: AS7261 CCT
    calculated_duv:
      name: AS7261 Duv
    lux:
      name: AS7261 Lux
    oklab_l:
      name: AS7261 OKLab L
    oklab_a:
      name: AS7261 OKLab a
    oklab_b:
      name: AS7261 OKLab b
    oklch_l:
      name: AS7261 OKLCH L
    oklch_c:
      name: AS7261 OKLCH C
    oklch_h:
      name: AS7261 OKLCH h
    completed_measurement_count:
      name: AS7261 Completed Measurement Count

  - platform: as7261
    as7261_id: as7261_sensor
    device_temperature:
      name: AS7261 Temperature
    duv_cie1976:
      name: AS7261 Vendor DUV CIE1976
    x_cie1931:
      name: AS7261 Vendor x CIE 1931
    y_cie1931:
      name: AS7261 Vendor y CIE 1931
    near_ir_percent:
      name: AS7261 Near IR Percent
    raw_clear:
      name: AS7261 Raw Clear
    raw_dark:
      name: AS7261 Raw Dark
    raw_near_ir:
      name: AS7261 Raw Near IR
    u_cie1960:
      name: AS7261 u CIE 1960
    v_cie1960:
      name: AS7261 v CIE 1960
    u_cie1976:
      name: AS7261 u CIE 1976
    v_cie1976:
      name: AS7261 v CIE 1976
    x:
      name: AS7261 X
    y:
      name: AS7261 Y
    z:
      name: AS7261 Z

text_sensor:
  - platform: as7261
    as7261_id: as7261_sensor
    firmware_version:
      name: AS7261 Firmware Version
